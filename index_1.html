<meta name="mobile-web-app-capable" content="yes">
<title>Glyphica: Typing Survival</title>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a14;

  canvas { display: block; width: 100%; height: 100%; }
  .modal { position: fixed; inset: 0; background: rgba(3,5,12,0.7); display: flex;

  .hidden { display: none !important; }
  .card { background: #0f1628; border: 1px solid rgba(255,255,255,0.12); border-radius: 18px; padding: 26px;
    width: min(380px, 90vw); color: #e6edf7; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .card.wide { width: min(760px, 94vw); max-height: 86vh; overflow: auto; }
  .card h2 { margin: 0 0 12px; color: #facc15; font-size: 22px; }
  .card label { display: block; font-size: 13px; color: #94a3b8; margin: 12px 0 6px; }
  .card input, .card select { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.18); background: #0a1020; color: #e6edf7; font: 16px Prompt, "Noto Sans Thai", sans-serif; }
  .card button { margin-top: 14px; margin-right: 8px; padding: 11px 16px; border-radius: 12px; border: 0;
    background: #facc15; color: #1a1200; font-weight: 700; font-size: 15px; cursor: pointer; }
  .card button.ghost { background: transparent; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.2); }
  .msg { min-height: 20px; margin-top: 10px; font-size: 14px; color: #94a3b8; }
  .msg.err { color: #f87171; } .msg.ok { color: #34d399; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters select { width: auto; flex: 1; min-width: 150px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
  th, td { padding: 8px 6px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
  th { color: #94a3b8; font-weight: 600; }
  tr.me td { color: #facc15; font-weight: 700; }
  .shopcard { position: relative; }
  .closeX { position: fixed; z-index: 12; top: 16px; right: 16px; margin: 0; width: 36px; height: 36px; padding: 0; border-radius: 50%;
    background: rgba(6,8,18,0.7); color: #e6edf7; border: 1px solid rgba(255,255,255,0.25); font-size: 16px; cursor: pointer; }
  .donate { position: fixed; right: 14px; bottom: 42px; z-index: 5; background: #facc15; color: #1a1200; border: 0;
    border-radius: 12px; padding: 9px 16px; font: 700 14px Prompt, sans-serif; cursor: pointer; }
  .acct { font-size: 26px; font-weight: 700; letter-spacing: 1px; color: #facc15; margin: 10px 0 4px; }
  .bank { color: #cbd5e1; font-size: 15px; }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .statgrid div { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 12px; }
  .statgrid b { display: block; font-size: 22px; color: #facc15; }
  .statgrid span { font-size: 12px; color: #94a3b8; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chips button { margin: 0; padding: 7px 12px; font-size: 13px; }
  .shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 14px; }
  .shopitem { border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 12px; cursor: pointer; background: rgba(255,255,255,0.03); transition: transform .15s, border-color .15s; }
  .shopitem:hover { transform: translateY(-3px); border-color: rgba(250,204,21,0.6); }
  .shopitem.on { border-color: #facc15; }
  .shopitem canvas { display: block; margin: 0 auto 6px; }
  .shopitem .nm { font-weight: 700; text-align: center; font-family: Prompt, sans-serif; }
  .shopitem .pr { font-size: 13px; color: #94a3b8; margin-top: 8px; text-align: center; font-family: Prompt, sans-serif; }
  .shopitem .pr.tag { display: block; width: fit-content; margin: 10px auto 0; background: #facc15; color: #1a1200; padding: 4px 12px; border-radius: 8px; font-weight: 700; }
  .awning { height: 26px; margin: -26px -26px 16px; border-radius: 18px 18px 0 0; background: repeating-linear-gradient(90deg, #f43f5e 0 40px, #fff7ed 40px 80px); box-shadow: 0 6px 0 rgba(0,0,0,0.25); }
  .shopitem .cls { font-size: 12px; color: #facc15; text-align: center; font-weight: 600; }
  .shopitem .pas { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 2px; min-height: 30px; }
  .shopitem .ab { font-size: 13px; font-weight: 700; text-align: center; margin-top: 6px; }
  .shopitem .abd { font-size: 12px; color: #cbd5e1; text-align: center; margin-top: 2px; }
  canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { overscroll-behavior: none; }

<canvas id="c"></canvas>
<input id="kbd" value=" " autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" style="position:fixed;left:-1000px;top:0;width:1px;height:1px;opacity:0">

    <button id="btnLogout" class="ghost" data-i18n="logout_btn" style="display:none"></button>
    <button id="btnLoginClose" class="ghost" data-i18n="close"></button>
  </div>
</div></div>
<div id="shopModal" class="modal hidden">
  <button id="btnShopClose" class="closeX" aria-label="close">✕</button>
  <div class="card wide shopcard">
  <div class="awning"></div>
  <h2 data-i18n="shop_title"></h2>
  <div class="msg" id="shopCoins"></div>
  <div class="shopgrid" id="shopGrid"></div>
</div></div>
<div id="profileModal" class="modal hidden"><div class="card">

  <div><button id="btnProfileLogout" class="ghost" data-i18n="logout_btn"></button><button id="btnProfileClose" class="ghost" data-i18n="close"></button></div>
</div></div>
<div id="boardModal" class="modal hidden"><div class="card wide">

  <div class="chips" id="boardDiff"></div>

  <button id="btnBoardClose" class="ghost" data-i18n="close"></button>

<button id="donateBtn" class="donate" data-i18n="donate_btn"></button>

let settings = { ...PRESETS.normal, preset: 'normal', theme: 'space', wordset: 'classic', lang: 'th', sound: 'on' };
let PALETTE = THEMES.space.palette;
let menuSel = 0, hits = [], startHit = null;

function isActive(sec, v) { return sec.key === 'preset' ? settings.preset === v : settings[sec.key] === v; }

function setValue(sec, v) {
  if (sec.type === 'slider') { v = Math.min(sec.max, Math.max(sec.min, Math.round(v / sec.step) * sec.step)); v = Number(v.toFixed(2)); }
  if (sec.key === 'preset') {
    Object.assign(settings, PRESETS[v]);
    settings.preset = v;
  } else {
    settings[sec.key] = v;
    if (!['theme', 'wordset', 'lang', 'sound'].includes(sec.key)) settings.preset = 'custom';
  }
  if (sec.key === 'theme') { PALETTE = THEMES[v].palette; initAmbient(); creatures = []; }
  if (sec.key === 'lang') applyDomLang();
  if (sec.key === 'sound') muted = v === 'off';
  saveSettings();
}

function stepFocused(dir) {
  const sec = SECTIONS[menuSel];
  if (sec.type === 'slider') { setValue(sec, settings[sec.key] + dir * sec.step); SFX.click(); return; }
  const cur = sec.key === 'preset' ? settings.preset : settings[sec.key];
  const i = Math.min(sec.opts.length - 1, Math.max(0, sec.opts.indexOf(cur) + dir));
  setValue(sec, sec.opts[i]);
  SFX.click();
}

// ---------- Canvas size & ambient objects ----------
let W, H, dpr, time = 0, last = performance.now();
let ambient = [], trees = [];
const TREE_LAYERS = [{ sp: 70, spd: 6, base: 40, h: 90, col: '#0d2516' },
                     { sp: 110, spd: 14, base: 25, h: 130, col: '#091c10' },
                     { sp: 160, spd: 26, base: 8, h: 170, col: '#050f09' }];

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initAmbient();
  trees = TREE_LAYERS.map(() => Array.from({ length: 30 }, () => 0.7 + Math.random() * 0.6));
}
addEventListener('resize', resize);

function initAmbient() {
  const counts = { space: 120, ocean: 40, ember: 70, forest: 28, cyber: 0 };
  const n = counts[settings.theme] || 0;
  ambient = Array.from({ length: n }, () => {
    const t = settings.theme;
    return {
      x: Math.random() * W, y: Math.random() * H,
      vx: t === 'ember' ? (Math.random() - 0.5) * 20 : t === 'forest' ? (Math.random() - 0.5) * 12 : 0,
      vy: t === 'space' ? 4 + Math.random() * 10
        : t === 'ocean' ? -(20 + Math.random() * 30)
        : t === 'ember' ? -(40 + Math.random() * 60)
        : (Math.random() - 0.5) * 10,
      s: 0.5 + Math.random() * 1.5, ph: Math.random() * 6.28
    };
  });
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

// ---------- Sound ----------
let actx = null, muted = false, masterGain = null;
function audio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.12, delay = 0, slideTo = null) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(masterGain);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol = 0.2) {
  if (muted || !actx) return;
  const len = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 1400;
  g.gain.value = vol;
  src.buffer = buf;
  src.connect(f).connect(g).connect(masterGain);
  src.start();
}
const SFX = {
  key:     () => tone(880 + Math.random() * 120, 0.05, 'triangle', 0.05),
  wrong:   () => tone(160, 0.18, 'square', 0.07, 0, 90),
  click:   () => tone(700, 0.06, 'sine', 0.08),
  kill:    n => { const b = 520 + Math.min(n, 12) * 45; tone(b, 0.12, 'sine', 0.14, 0, b * 2); tone(b * 1.5, 0.18, 'triangle', 0.05, 0.03); noiseBurst(0.12, 0.08); },
  gold:    () => [1046, 1318, 1568].forEach((f, i) => tone(f, 0.2, 'triangle', 0.09, i * 0.05)),
  combo:   () => { tone(660, 0.1, 'triangle', 0.1); tone(990, 0.16, 'triangle', 0.08, 0.07); noiseBurst(0.2, 0.06); },
  hurt:    () => { tone(220, 0.45, 'sawtooth', 0.14, 0, 40); noiseBurst(0.25, 0.18); },
  levelup: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, 'triangle', 0.12, i * 0.09)),
  select:  () => { tone(1200, 0.08, 'sine', 0.1); tone(1600, 0.12, 'sine', 0.06, 0.05); },
  over:    () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'sawtooth', 0.09, i * 0.2))
};

// ---------- Upgrades ----------
const UPGRADES = [
  { key: 'hp',     apply() { maxLives++; lives++; } },
  { key: 'slow',   apply() { stats.slow *= 0.92; } },
  { key: 'power',  apply() { stats.power += 0.25; } },
  { key: 'shield', apply() { stats.shield = true; } },
  { key: 'xp',     apply() { stats.xp += 0.3; } },
  { key: 'gold',   apply() { stats.gold += 0.05; } },
  { key: 'chain',  apply() { stats.chain = true; } },
  { key: 'freeze', apply() { stats.freezeSec += 2.5; } },
  { key: 'reprieve', apply() { stats.reprieve = true; } }

];

// ---------- Game state ----------
let state = 'menu';   // menu | play | paused | levelup | over
let enemies = [], particles = [], rings = [], texts = [], arcs = [], choices = [], cardHits = [];
let typed = '', score = 0, combo = 0, kills = 0, best = 0;
let maxLives = 3, lives = 3, playerLevel = 1, xp = 0;
let stats = { slow: 1, power: 1, shield: false, xp: 1, gold: 0 };
let spawnTimer = 0, damageFlash = 0, errorFlash = 0, levelFlash = 0, shake = 0;

const DANGER_Y = () => H - 100;
const xpNeeded = () => 25 + (playerLevel - 1) * 15;

function reset() {
  audio();
  enemies = []; particles = []; rings = []; texts = []; arcs = []; typed = '';
  score = 0; combo = 0; kills = 0;
  maxLives = (stageCfg ? stageCfg.lives : settings.lives) + (classOf() === 'Classic' ? 1 : 0); lives = maxLives;
  stageWon = false;
  playerLevel = 1; xp = 0;
  stats = { slow: 1, power: 1, shield: false, xp: 1, gold: 0, chain: false, freezeSec: 0, reprieve: false };
  freezeT = 0; reprieveReady = !!stats.reprieve;
  focusKbd();
  spawnTimer = 800; damageFlash = 0; errorFlash = 0; levelFlash = 0; shake = 0; playMs = 0; run = newRun(); runCoins = 0; keyFeed = []; abilityCd = 0; focusT = 0; overclockT = 0; lastKillAt = -99999; saveStatus = ''; lastStage = -1; stageBanner = null; glitches = []; wordBag = [];
  if (!seenHint) { hintT = 7000; seenHint = true; try { localStorage.setItem('glyphica.hint', '1'); } catch (e) {} }
  state = 'play';
}

function wordPool() {
  if (stageCfg) return stagePool;
  const L = settings.len;
  return WORD_SETS[settings.wordset].filter(w => L === 'short' ? w.length <= 5 : L === 'long' ? w.length >= 7 : true);
}

function spawn() {
  const pool = wordPool();
  const gold = Math.random() < 0.08 + stats.gold;
  enemies.push({
    text: nextWord(pool),
    x: 60 + Math.random() * Math.max(40, W - 260),
    y: -40,
    speed: (26 + playerLevel * 6 + Math.random() * 12) * settings.speed * (stageCfg ? stageCfg.speed * (stageCfg.endless ? Math.min(2.5, 1 + playMs / 120000) : 1) : 1),
    gold,
    color: gold ? GOLD : PALETTE[Math.floor(Math.random() * PALETTE.length)],
    wobble: Math.random() * Math.PI * 2
  });
}

function lockedTarget() {
  if (!typed) return null;
  let b = null;
  for (const e of enemies) if (e.text.startsWith(typed) && (!b || e.y > b.y)) b = e;
  return b;
}

// ---------- Effects ----------
function emit(x, y, o = {}) {
  const n = o.count ?? 20, speed = o.speed ?? 200;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.4 + Math.random() * 0.8);
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, decay: o.decay ?? 1.4, size: o.size ?? (1.5 + Math.random() * 3),
      color: o.color ?? PALETTE[Math.floor(Math.random() * PALETTE.length)],
      type: o.type ?? 'dot', rot: Math.random() * 6, rotV: (Math.random() - 0.5) * 12,
      grav: o.grav ?? 60, drag: o.drag ?? 0.96
    });
  }
}
function lightning(x1, y1, x2, y2, color) {
  const pts = [], seg = 12;
  for (let i = 0; i <= seg; i++) {
    const t = i / seg, j = i && i < seg ? 40 : 0;
    pts.push([x1 + (x2 - x1) * t + (Math.random() - 0.5) * j, y1 + (y2 - y1) * t + (Math.random() - 0.5) * j]);
  }
  arcs.push({ pts, color, life: 1 });
}
function floatText(text, x, y, color, size = 18) { texts.push({ text, x, y, life: 1, color, size }); }

function destroy(e, chained = false) {
  enemies = enemies.filter(en => en !== e);
  combo++; kills++;
  const gained = Math.round((e.text.length * 10 + combo * 5) * stats.power * (e.gold ? 3 : 1) * killMult());
  score += gained;
  runCoins += Math.max(1, Math.round((Math.floor(e.text.length / 2) + (e.gold ? 5 : 0)) * (classOf() === 'Pro' ? 1.5 : 1)));
  best = Math.max(best, score);

  const cx = e.x + 30;
  emit(cx, e.y, { count: 14, speed: 240, color: e.color, type: 'shard', size: 5 + Math.random() * 4, grav: 180, drag: 0.94 });
  emit(cx, e.y, { count: 22, speed: 320, color: '#ffffff', type: 'spark', size: 2, decay: 2.2, grav: 0, drag: 0.92 });
  rings.push({ x: cx, y: e.y, r: 10, color: e.color, life: 1, w: 3 });
  rings.push({ x: cx, y: e.y, r: 4, color: '#ffffff', life: 0.6, w: 1.5 });
  floatText(`+${gained}`, cx, e.y - 30, GOLD, e.gold ? 26 : 20);
  if (e.gold) {
    SFX.gold();
    floatText(tr('gold_pop'), cx, e.y - 60, GOLD, 16);
    emit(cx, e.y, { count: 30, speed: 280, color: GOLD, type: 'confetti', size: 4, grav: 120 });
  }
  shake = Math.min(12, 4 + combo * 0.4);
  SFX.kill(combo);
  stageKill(e, cx);
  if (stats.chain && !chained && enemies.length && Math.random() < 0.25) destroy(enemies[Math.floor(Math.random() * enemies.length)], true);
  if (stats.freezeSec && kills % 15 === 0) freezeT = stats.freezeSec * 1000;
  if (tierOf(combo)) tierKill(cx, e.y);
  if (TIERS.some(x => x.at === combo)) tierBurst(tierOf(combo));

  if (combo % 5 === 0) {
    SFX.combo();
    floatText(`${tr('combo_pop')}${combo}!`, W / 2, H * 0.3, '#fb923c', 34);
    lightning(W / 2 - 200 + Math.random() * 400, 0, cx, e.y, '#fb923c');
    lightning(W / 2 - 200 + Math.random() * 400, 0, cx, e.y, '#f472b6');
    emit(W / 2, H * 0.3, { count: 40, speed: 300, color: '#fb923c', type: 'spark', size: 2, decay: 1.2, grav: 0 });
  }

  xp += Math.round(e.text.length * stats.xp * (e.gold ? 2 : 1) * (overclockT > 0 ? 2 : 1));
  if (xp >= xpNeeded()) {
    xp -= xpNeeded();
    playerLevel++;
    levelFlash = 800;
    SFX.levelup();
    emit(W / 2, H / 2, { count: 60, speed: 420, type: 'confetti', size: 5, grav: 260, decay: 0.5 });
    emit(W / 2, H / 2, { count: 30, speed: 500, color: GOLD, type: 'spark', size: 2, decay: 1.8, grav: 0 });
    openLevelUp();
  }
  if (stageCfg && kills >= stageCfg.goal && state !== 'over') {
    stageWon = true; state = 'over'; SFX.levelup(); finalizeRun(); saveProgress();
  }
  typed = '';
}

function openLevelUp() {
  reprieveReady = !!stats.reprieve;
  const pool = UPGRADES.slice();
  choices = [];
  for (let i = 0; i < 3 && pool.length; i++) choices.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  typed = '';
  state = 'levelup';
}
function chooseUpgrade(i) {
  if (state !== 'levelup' || !choices[i]) return;
  SFX.select();
  choices[i].apply();
  choices = [];
  state = 'play';
}

function hurtEnemy(e) {
  if (reprieveReady) { reprieveReady = false; e.y = -40; return; }
  enemies = enemies.filter(en => en !== e);
  lives--; combo = 0; typed = '';
  damageFlash = 400; shake = 14;
  emit(e.x + 30, DANGER_Y(), { count: 36, speed: 280, color: '#f87171', type: 'shard', size: 5, grav: 200 });
  rings.push({ x: e.x + 30, y: DANGER_Y(), r: 10, color: '#f87171', life: 1, w: 3 });
  SFX.hurt();
}

// ---------- Update ----------
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 0.03);
  for (const a of ambient) {
    a.x += a.vx * dt / 1000; a.y += a.vy * dt / 1000; a.ph += dt / 500;
    if (a.x < -20) a.x += W + 40; if (a.x > W + 20) a.x -= W + 40;
    if (a.y < -20) a.y += H + 40; if (a.y > H + 20) a.y -= H + 40;
  }
  if (state !== 'play') { updateFX(dt); return; }
  playMs += dt;
  if (playMs - run.lastSample >= 5000) { run.lastSample = playMs; sampleRun(); }
  checkStage();
  if (combo >= 5 && Math.random() < 0.25) auraTick();

  freezeT = Math.max(0, freezeT - dt);
  abilityCd = Math.max(0, abilityCd - dt);
  focusT = Math.max(0, focusT - dt);
  overclockT = Math.max(0, overclockT - dt);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawn();
    spawnTimer = Math.max(400, 2400 - playerLevel * 120) * (0.7 + Math.random() * 0.6) / settings.spawn;
  }
  for (const e of enemies) {
    e.y += e.speed * stats.slow * (freezeT > 0 ? 0 : 1) * (focusT > 0 ? 0.5 : 1) * dt / 1000;
    e.wobble += dt / 400;
    if (e.gold && Math.random() < 0.5) emit(e.x + Math.random() * 60, e.y, { count: 1, speed: 40, color: GOLD, type: 'spark', size: 1.5, decay: 2.5, grav: -20 });
  }
  for (const e of enemies.filter(en => en.y > DANGER_Y())) {
    hurtEnemy(e);
    if (lives <= 0) { state = 'over'; SFX.over(); finalizeRun(); saveStatus = ''; saveScore(); return; }
  }
  errorFlash = Math.max(0, errorFlash - dt);
  damageFlash = Math.max(0, damageFlash - dt);
  levelFlash = Math.max(0, levelFlash - dt);
  updateFX(dt);
}

function updateFX(dt) {
  const s = dt / 1000;
  for (const p of particles) {
    p.x += p.vx * s; p.y += p.vy * s;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.grav * s;
    p.rot += p.rotV * s; p.life -= s * p.decay;
  }
  particles = particles.filter(p => p.life > 0);
  for (const r of rings) { r.r += 260 * s; r.life -= s * 2.2; }
  rings = rings.filter(r => r.life > 0);
  for (const t of texts) { t.y -= 40 * s; t.life -= s * 1.1; }
  texts = texts.filter(t => t.life > 0);
  for (const c of creatures) { c.x += c.vx * s; c.t += s; }
  creatures = creatures.filter(c => c.x > -220 && c.x < W + 220);
  if (creatures.length < 3 && Math.random() < s / 4) spawnCreature();
  hintT = Math.max(0, hintT - dt);
  for (const a of arcs) a.life -= s * 3;
  for (const g of glitches) g.life -= s * 3;
  glitches = glitches.filter(g => g.life > 0);
  if (stageBanner) { stageBanner.life -= s * 0.45; if (stageBanner.life <= 0) stageBanner = null; }
  arcs = arcs.filter(a => a.life > 0);
}

// ---------- Scenes ----------
function drawScene(T) {
  const t = time / 1000;
  const th = settings.theme;
  ctx.save();

  if (th === 'space') {
    for (let i = 0; i < 3; i++) {
      const x = W * (0.2 + 0.3 * i), y = H * (0.3 + 0.15 * Math.sin(t * 0.2 + i));
      const g = ctx.createRadialGradient(x, y, 0, x, y, W * 0.35);
      g.addColorStop(0, hexA(T.accent, 0.16)); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    const pr = Math.min(W, H) * 0.09, px = W * 0.82, py = H * 0.22 + Math.sin(t * 0.3) * 6;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(px, py, pr * 1.6, pr * 0.4, -0.3, Math.PI, 0); ctx.stroke();
    const pg = ctx.createRadialGradient(px - pr * 0.35, py - pr * 0.35, pr * 0.1, px, py, pr);
    pg.addColorStop(0, '#f9a8d4'); pg.addColorStop(1, '#4c1d95');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px, py, pr * 1.6, pr * 0.4, -0.3, 0, Math.PI); ctx.stroke();
    for (const a of ambient) {
      ctx.fillStyle = `rgba(220,230,255,${0.3 + 0.7 * Math.abs(Math.sin(a.ph))})`;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.s, 0, Math.PI * 2); ctx.fill();
    }
  }

  else if (th === 'ocean') {
    for (let i = 0; i < 5; i++) {
      const x = W * (0.1 + i * 0.2) + Math.sin(t * 0.4 + i) * 40;
      const g = ctx.createLinearGradient(x, 0, x + 60, H);
      g.addColorStop(0, 'rgba(180,240,255,0.12)'); g.addColorStop(1, 'rgba(180,240,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 120, 0); ctx.lineTo(x + 260, H); ctx.lineTo(x + 140, H); ctx.fill();
    }
    for (const a of ambient) {
      ctx.strokeStyle = 'rgba(200,245,255,0.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.s * 2.5, 0, Math.PI * 2); ctx.stroke();
    }
    for (let w = 0; w < 3; w++) {
      ctx.fillStyle = hexA(T.accent, 0.05 + w * 0.04);
      ctx.beginPath(); ctx.moveTo(0, H);
      for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 80 + w * 26 + Math.sin(x * 0.01 + t * (1 + w * 0.5) + w) * 12);
      ctx.lineTo(W, H); ctx.fill();
    }
  }

  else if (th === 'ember') {
    const glow = ctx.createRadialGradient(W / 2, H, 10, W / 2, H, W * 0.6);
    glow.addColorStop(0, 'rgba(255,120,30,0.45)'); glow.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1a0805';
    ctx.beginPath(); ctx.moveTo(-40, H); ctx.lineTo(W * 0.14, H * 0.66); ctx.lineTo(W * 0.3, H * 0.8);
    ctx.lineTo(W * 0.42, H); ctx.fill();
    ctx.fillStyle = `rgba(255,140,40,${0.5 + 0.2 * Math.sin(t * 3)})`;
    ctx.beginPath(); ctx.ellipse(W * 0.14, H * 0.66, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    for (const a of ambient) {
      ctx.fillStyle = `rgba(255,${120 + a.s * 40},40,${0.4 + 0.5 * Math.abs(Math.sin(a.ph))})`;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.s * 1.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  else if (th === 'forest') {
    TREE_LAYERS.forEach((L, li) => {
      const off = (t * L.spd) % L.sp;
      ctx.fillStyle = L.col;
      for (let i = -1; i < Math.ceil(W / L.sp) + 2; i++) {
        const x = i * L.sp - off, idx = ((i % 30) + 30) % 30;
        const h = L.h * trees[li][idx], base = H - L.base;
        ctx.beginPath();
        ctx.moveTo(x, base - h); ctx.lineTo(x + L.sp * 0.3, base); ctx.lineTo(x - L.sp * 0.3, base);
        ctx.fill();
      }
    });
    ctx.globalCompositeOperation = 'lighter';
    for (const a of ambient) {
      const al = Math.max(0, Math.sin(a.ph));
      ctx.fillStyle = `rgba(190,255,140,${al * 0.8})`;
      ctx.beginPath(); ctx.arc(a.x, a.y, 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  else if (th === 'cyber') {
    const horizon = H * 0.6, sunR = Math.min(W, H) * 0.14, sx = W / 2, sy = horizon - sunR * 0.35;
    const sg = ctx.createLinearGradient(0, sy - sunR, 0, sy + sunR);
    sg.addColorStop(0, '#fde047'); sg.addColorStop(1, '#e879f9');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sx, sy, sunR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = T.top;
    for (let i = 0; i < 5; i++) ctx.fillRect(sx - sunR, sy + sunR * 0.1 + i * sunR * 0.2, sunR * 2, sunR * 0.08 + i * 2);
    const floor = ctx.createLinearGradient(0, horizon, 0, H);
    floor.addColorStop(0, '#2a0a3a'); floor.addColorStop(1, '#07000f');
    ctx.fillStyle = floor; ctx.fillRect(0, horizon, W, H - horizon);
    ctx.strokeStyle = hexA(T.accent, 0.3); ctx.lineWidth = 1.5;
    for (let i = 0; i < 14; i++) {
      const p = (i + (t * 0.8) % 1) / 14, y = horizon + p * p * (H - horizon);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.strokeStyle = hexA(T.accent, 0.22);
    for (let j = -12; j <= 12; j++) {
      ctx.beginPath(); ctx.moveTo(W / 2, horizon); ctx.lineTo(W / 2 + j * W * 0.12, H); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  }

  ctx.restore();
}

// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function panel(x, y, w, h, r = 14, a = 0.55) {
  ctx.save();
  ctx.fillStyle = `rgba(6,10,22,${a})`;
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  roundRect(x, y, w, h, r); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawBackground() {
  const T = THEMES[settings.theme];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, T.top); g.addColorStop(1, T.bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  drawScene(T);
  drawCreatures();
  if (state !== 'menu') {
    const near = enemies.reduce((m, e) => Math.max(m, e.y / DANGER_Y()), 0);
    const glow = 0.4 + 1.2 * Math.max(0, near - 0.5) + 0.2 * Math.sin(time / 200);
    ctx.save();
    ctx.shadowColor = `rgb(${T.danger})`; ctx.shadowBlur = 16 * glow;
    ctx.setLineDash([10, 8]);
    ctx.strokeStyle = `rgba(${T.danger},${Math.min(1, glow)})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, DANGER_Y()); ctx.lineTo(W, DANGER_Y()); ctx.stroke();
    ctx.restore();
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

function drawEnemies() {
  const locked = lockedTarget();
  ctx.font = '600 22px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  for (const e of enemies) {
    const dx = e.x + Math.sin(e.wobble) * 4;
    const w = ctx.measureText(e.text).width + 24;
    const isLocked = e === locked;
    ctx.save();
    ctx.shadowColor = isLocked ? GOLD : e.color;
    ctx.shadowBlur = isLocked ? 22 : (e.gold ? 20 : 10);
    ctx.fillStyle = isLocked ? 'rgba(250,204,21,0.14)' : 'rgba(10,14,28,0.72)';
    ctx.strokeStyle = isLocked ? GOLD : e.color;
    ctx.lineWidth = 2;
    roundRect(dx, e.y - 18, w, 36, 10);
    ctx.fill(); ctx.stroke();
    if (e.gold) {
      ctx.clip();
      const sx = ((time / 3) % (w + 80)) - 40;
      const sg = ctx.createLinearGradient(dx + sx - 20, 0, dx + sx + 20, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(0.5, 'rgba(255,255,255,0.55)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg; ctx.fillRect(dx, e.y - 18, w, 36);
    }
    ctx.restore();

    if (isLocked) {
      ctx.fillStyle = GOLD;
      ctx.fillText(typed, dx + 12, e.y);
      const tw = ctx.measureText(typed).width;
      ctx.fillStyle = '#e6edf7';
      ctx.fillText(e.text.slice(typed.length), dx + 12 + tw, e.y);
    } else {
      ctx.fillStyle = e.gold ? GOLD : '#e6edf7';
      ctx.fillText(e.text, dx + 12, e.y);
    }
  }
}

function drawFX() {
  for (const r of rings) {
    ctx.globalAlpha = Math.max(0, r.life);
    ctx.strokeStyle = r.color; ctx.lineWidth = r.w || 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = Math.max(0, p.life);
    ctx.globalAlpha = a; ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
    if (p.type === 'spark') {
      ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke();
    } else if (p.type === 'shard' || p.type === 'confetti') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size * 0.8;
      if (p.type === 'confetti') ctx.fillRect(-s / 2, -s, s, s * 2); else ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * Math.max(0.3, a), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  ctx.globalAlpha = 1;
  for (const g of glitches) {
    ctx.globalAlpha = g.life * 0.35;
    ctx.fillStyle = g.color;
    ctx.fillRect(g.shift, g.y, W, g.h);
  }
  ctx.globalAlpha = 1;
  for (const a of arcs) {
    ctx.save();
    ctx.globalAlpha = a.life; ctx.strokeStyle = a.color;
    ctx.shadowColor = a.color; ctx.shadowBlur = 14; ctx.lineWidth = 2;
    ctx.beginPath();
    a.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke(); ctx.restore();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.life * 1.5);
    ctx.font = `700 ${t.size}px Prompt, "Noto Sans Thai", sans-serif`;
    ctx.fillStyle = t.color; ctx.shadowColor = t.color; ctx.shadowBlur = 12;
    ctx.fillText(t.text, t.x, t.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ---------- HUD ----------
const MUTE = { x: () => W - 40, y: () => (state === 'menu' ? 38 : 44), r: 16 };
function drawMuteButton() {
  const x = MUTE.x(), y = MUTE.y(), r = MUTE.r;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(15,22,40,0.85)';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#cbd5e1';
  for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-2.5, -11, 5, 5); }
  ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(15,22,40,0.95)';
  ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function onMute(px, py) { const dx = px - MUTE.x(), dy = py - MUTE.y(); return dx * dx + dy * dy <= (MUTE.r + 4) ** 2; }

function drawHUD(T) {
  const narrow = W < 620;
  panel(16, 12, W - 32, 64, 14);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  // Score

  ctx.fillText(tr('score'), 36, 30);
  ctx.fillStyle = '#e6edf7'; ctx.font = `700 ${narrow ? 22 : 26}px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.fillText(String(score), 36, 60);

  // Level with XP bar
  const lx = narrow ? 140 : 180, lw = narrow ? 100 : 170;

  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  roundRect(lx, 38, lw, 9, 5); ctx.fill();
  ctx.save();

  ctx.restore();
  ctx.fillStyle = '#94a3b8'; ctx.font = '12px Prompt, "Noto Sans Thai", sans-serif';

  // Combo
  const cx0 = narrow ? 262 : 384;
  ctx.fillStyle = '#94a3b8'; ctx.font = '600 11px Prompt, "Noto Sans Thai", sans-serif';
  ctx.fillText(tr('combo'), cx0, 30);
  ctx.fillStyle = combo >= 3 ? GOLD : '#e6edf7'; ctx.font = `700 ${narrow ? 22 : 26}px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.fillText(`×${combo}`, cx0, 60);

  // Lives (number with a heart) and the mute button on the right
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f87171'; ctx.font = '700 22px Prompt, "Noto Sans Thai", sans-serif';
  ctx.fillText(`♥ ${lives}/${maxLives}`, W - 66, 50);

}

function drawInputBar(T) {
  const y = H - 40;
  ctx.save();
  if (errorFlash > 0) { ctx.shadowColor = '#f87171'; ctx.shadowBlur = 20; }
  ctx.fillStyle = errorFlash > 0 ? 'rgba(248,113,113,0.25)' : 'rgba(6,10,22,0.6)';
  ctx.strokeStyle = errorFlash > 0 ? '#f87171' : 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  roundRect(W / 2 - 180, y - 20, 360, 40, 10); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.font = '22px "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
  ctx.fillStyle = GOLD; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (!typed) {
    ctx.fillStyle = 'rgba(148,163,184,0.55)';
    ctx.font = '16px Prompt, "Noto Sans Thai", sans-serif';
    ctx.fillText(tr('type_here'), W / 2, y);

    ctx.fillText(typed + (Math.floor(Date.now() / 500) % 2 ? '|' : ' '), W / 2, y);
  }

}

// ---------- Screens ----------
function dimScreen(a = 0.7) { ctx.fillStyle = `rgba(5,8,15,${a})`; ctx.fillRect(0, 0, W, H); }

function overlay(title, lines) {
  dimScreen(0.7);
  const pw = Math.min(600, W - 30);
  panel(W / 2 - pw / 2, H / 2 - 170, pw, 300, 20, 0.6);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD; ctx.shadowBlur = 30;
  ctx.font = '700 48px Prompt, "Noto Sans Thai", sans-serif';
  ctx.fillText(title, W / 2, H / 2 - 90);
  ctx.restore();
  ctx.fillStyle = '#e6edf7'; ctx.font = '18px Prompt, "Noto Sans Thai", sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 - 20 + i * 32));
  ctx.textAlign = 'left';
}

function chip(x, y, w, h, label, active) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRect(x, y + 3, w, h, 12); ctx.fill();
  if (active) { ctx.globalAlpha = 0.28; ctx.fillStyle = THEMES[settings.theme].accent; roundRect(x, y, w, h, 10); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.fillStyle = active ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.05)';
  ctx.strokeStyle = active ? THEMES[settings.theme].accent : 'rgba(255,255,255,0.14)';
  ctx.lineWidth = active ? 2 : 1;
  roundRect(x, y, w, h, 10); ctx.stroke();
  ctx.fillStyle = active ? '#ffffff' : '#cbd5e1';
  ctx.font = `600 15px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2);
  ctx.restore();
}

function chipFlow(si, sec, x, y, maxW) {
  let cx = x, cy = y;
  ctx.font = '600 15px Prompt, "Noto Sans Thai", sans-serif';
  for (const v of sec.opts) {
    const label = sec.label(v);
    const w = ctx.measureText(label).width + 28;
    if (cx + w > x + maxW && cx > x) { cx = x; cy += 44; }
    chip(cx, cy, w, 34, label, isActive(sec, v));
    hits.push({ x: cx, y: cy, w, h: 34, si, v });
    cx += w + 8;
  }
  return cy + 34;
}

function themeCards(si, sec, x, y, colW) {
  const cw = (colW - 12) / 2, ch = 74;
  sec.opts.forEach((k, i) => {
    const T = THEMES[k];
    const cx = x + (i % 2) * (cw + 12), cy = y + Math.floor(i / 2) * (ch + 12);
    const active = settings.theme === k;
    const g = ctx.createLinearGradient(0, cy, 0, cy + ch);
    g.addColorStop(0, T.top); g.addColorStop(1, T.bottom);
    ctx.save();
    ctx.fillStyle = g; ctx.strokeStyle = active ? T.accent : 'rgba(255,255,255,0.14)';
    ctx.lineWidth = active ? 3 : 1;
    if (active) { ctx.shadowColor = T.accent; ctx.shadowBlur = 16; }
    roundRect(cx, cy, cw, ch, 12); ctx.fill(); ctx.stroke();
    ctx.restore();
    T.palette.forEach((c, j) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx + 14 + j * 14, cy + 16, 4.5, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = '#ffffff'; ctx.font = '700 15px Prompt, "Noto Sans Thai", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(T.name, cx + 14, cy + ch - 16);
    hits.push({ x: cx, y: cy, w: cw, h: ch, si, v: k });
  });
  return y + Math.ceil(sec.opts.length / 2) * (ch + 12);
}

function drawSettingsPage() {
  hits = []; startHit = null; sliderHits = []; stepHits = [];
  const narrow = W < 760;
  const titleY = Math.max(narrow ? 56 : 64, H * 0.1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD; ctx.shadowBlur = 26 + 8 * Math.sin(time / 400);
  ctx.font = `800 ${narrow ? 42 : 58}px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.fillText(tr('settings_title'), W / 2, titleY);
  ctx.restore();
  ctx.fillStyle = '#94a3b8'; ctx.font = `600 ${narrow ? 13 : 16}px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.fillText(tr('subtitle'), W / 2, titleY + (narrow ? 32 : 38));

  const colW = narrow ? Math.min(420, W - 40) : Math.min(400, (W - 100) / 2), gap = narrow ? 0 : 56;
  const left = narrow ? W / 2 - colW / 2 : W / 2 - (colW * 2 + gap) / 2;
  const cols = narrow ? [left, left] : [left, left + colW + gap];
  const top = titleY + (narrow ? 70 : 84);
  const ys = [top, top];
  let shared = top;
  const colHead = [tr('col_game'), tr('col_look')];
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

  const order = narrow ? SECTIONS.slice().sort((a, b) => a.col - b.col) : SECTIONS;
  order.forEach(sec => {
    const si = SECTIONS.indexOf(sec);
    const col = narrow ? 0 : sec.col;
    const x = cols[col];
    let y = narrow ? shared : ys[col];
    const focus = si === menuSel;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = focus ? GOLD : '#94a3b8';
    ctx.font = '700 12px Prompt, "Noto Sans Thai", sans-serif';
    ctx.fillText(tr(sec.title), x, y);
    y += 14;
    if (sec.type === 'themes') y = themeCards(si, sec, x, y, colW);
    else if (sec.type === 'slider') y = sliderRow(si, sec, x, y, colW);
    else y = chipFlow(si, sec, x, y, colW);
    if (narrow) shared = y + 26; else ys[col] = y + 26;
  });

  startHit = null;

  ctx.fillStyle = '#64748b'; ctx.font = `${narrow ? 12 : 14}px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function drawLevelUp(T) {
  const narrow = W < 620;
  dimScreen(0.75);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save();
  ctx.fillStyle = GOLD; ctx.shadowColor = GOLD; ctx.shadowBlur = 24;
  ctx.font = `800 ${narrow ? 32 : 44}px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.fillText(`${tr('levelup')}  ${playerLevel}`, W / 2, H / 2 - (narrow ? 230 : 170));
  ctx.restore();
  ctx.fillStyle = '#94a3b8'; ctx.font = `${narrow ? 14 : 17}px Prompt, "Noto Sans Thai", sans-serif`;
  ctx.fillText(tr('levelup_sub'), W / 2, H / 2 - (narrow ? 190 : 124));
  cardHits = [];

  if (narrow) {
    const cw = Math.min(360, W - 40), ch = 84, gap = 12;
    choices.forEach((u, i) => {
      const x = W / 2 - cw / 2, y = H / 2 - 160 + i * (ch + gap) + Math.sin(time / 300 + i) * 2;
      cardHits.push({ x, y, w: cw, h: ch });
      ctx.save();
      ctx.shadowColor = T.accent; ctx.shadowBlur = 14;
      ctx.fillStyle = 'rgba(10,14,28,0.9)'; ctx.strokeStyle = T.accent; ctx.lineWidth = 2;
      roundRect(x, y, cw, ch, 14); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.textAlign = 'left';
      ctx.fillStyle = '#e6edf7'; ctx.font = '700 18px Prompt, "Noto Sans Thai", sans-serif';
      ctx.fillText(`[${i + 1}]  ${tr(u.key + '_n')}`, x + 18, y + 32);
      ctx.fillStyle = '#94a3b8'; ctx.font = '15px Prompt, "Noto Sans Thai", sans-serif';
      ctx.fillText(tr(u.key + '_d'), x + 18, y + 60);
    });
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    return;
  }

  const cw = Math.min(240, (W - 80) / 3), ch = 180, gap = 22;
  const total = choices.length * cw + (choices.length - 1) * gap;
  const sx = W / 2 - total / 2, y = H / 2 - 80;
  choices.forEach((u, i) => {
    const x = sx + i * (cw + gap), hov = Math.sin(time / 300 + i) * 3;
    cardHits.push({ x, y: y + hov, w: cw, h: ch });
    ctx.save();
    ctx.shadowColor = T.accent; ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(10,14,28,0.85)'; ctx.strokeStyle = T.accent; ctx.lineWidth = 2;
    roundRect(x, y + hov, cw, ch, 14); ctx.fill(); ctx.stroke();
    ctx.restore();
    ctx.textAlign = 'center';
    ctx.fillStyle = GOLD; ctx.font = '700 13px Prompt, "Noto Sans Thai", sans-serif';
    ctx.fillText(`[${i + 1}]`, x + cw / 2, y + hov + 24);
    ctx.fillStyle = '#e6edf7'; ctx.font = '700 20px Prompt, "Noto Sans Thai", sans-serif';
    ctx.fillText(tr(u.key + '_n'), x + cw / 2, y + hov + 66);
    ctx.fillStyle = '#94a3b8'; ctx.font = '15px Prompt, "Noto Sans Thai", sans-serif';
    wrapText(tr(u.key + '_d'), x + cw / 2, y + hov + 110, cw - 32, 22);
  });
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function wrapText(text, cx, y, maxW, lh) {
  let line = '', lines = [];
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, cx, y + i * lh));
}

function draw() {
  const T = THEMES[settings.theme];
  ctx.save();
  if (shake > 0.1) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  if (state === 'menu') { ctx.restore(); drawMenuRouter(); drawMuteButton(); return; }
  drawEnemies();
  drawFX();
  drawHUD(T);
  drawInputBar(T);
  if (hintT > 0 && state === 'play') {
    ctx.save(); ctx.globalAlpha = Math.min(1, hintT / 1000);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#cbd5e1'; ctx.font = '600 14px Prompt, "Noto Sans Thai", sans-serif';
    ctx.fillText(settings.lang === 'th' ? 'พิมพ์คำที่ร่วงลงมา  ·  Space = ท่าพิเศษ  ·  Esc = หยุด' : 'Type the falling words  ·  Space = ability  ·  Esc = pause', W / 2, 118);
    ctx.restore();
  }
  drawStageBanner();
  if (state === 'play') { drawPauseButton(); drawAvatar(); }
  ctx.restore();

  if (damageFlash > 0) {
    ctx.fillStyle = `rgba(248,113,113,${0.3 * damageFlash / 400})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (state === 'paused') {
    overlay(tr('paused'), [tr('paused_1')]);
    drawOverlayButtons([{ label: tr('resume'), act: () => { state = 'play'; } }, { label: tr('menu'), act: () => { goMenu(); } }]);
  }
  if (state === 'levelup') drawLevelUp(T);
  if (state === 'over') drawSummary();

}

function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  try {
    update(dt);
    draw();
    drawCredit();
  } catch (err) {
    // Never let one bad frame stop the game loop for good.
    console.error(err);
  }
  requestAnimationFrame(frame);
}

// ---------- Input ----------
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (onMute(x, y)) {
    audio();
    if (state === 'menu') page = page === 'settings' ? 'home' : 'settings';
    else if (state === 'play') state = 'paused';
    return;
  }
  const inBox = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  if ((state === 'paused' || state === 'over')) {
    const b = overlayBtnHits.find(inBox);
    if (b) { audio(); SFX.click(); b.act(); return; }
  }
  if (state === 'play' && avatarHit && inBox(avatarHit)) { useAbility(); return; }
  if (state === 'play' && inBox(pauseHit)) { SFX.click(); state = 'paused'; return; }
  if (state === 'play') focusKbd();
  const inRect = r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

  if (state === 'menu') {
    if (page === 'home') {
      if (boardBtnHit && inRect(boardBtnHit)) { openBoard(); return; }
      if (accountBtnHit && inRect(accountBtnHit)) { if (session.name) openProfile(); else openLogin(); return; }
      if (stallHit && inRect(stallHit)) { openShop(); return; }
      const b = homeHits.find(inRect);
      if (b) { SFX.click(); b.act(); }
      return;
    }
    if (backHit && inRect(backHit)) { SFX.click(); page = 'home'; return; }
    const st = stepHits.find(inRect);
    if (st) { menuSel = st.si; stepFocused(st.dir); return; }
    const h = hits.find(inRect);
    if (h) { menuSel = h.si; setValue(SECTIONS[h.si], h.v); SFX.click(); }
    return;
  }
  if (state === 'levelup') {
    const i = cardHits.findIndex(inRect);
    if (i >= 0) chooseUpgrade(i);
  }
});

addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); audio(); muted = !muted; settings.sound = muted ? 'off' : 'on'; saveSettings(); return; }
  if (document.querySelector('.modal:not(.hidden)')) return;

  if (state === 'menu') {
    if (e.key === 'Escape' && page !== 'home') { page = 'home'; return; }
    if (page === 'home') {
      if (e.key === 'Enter') { stageCfg = null; reset(); }
      return;
    }
      if (e.key === 'ArrowUp')        { e.preventDefault(); menuSel = (menuSel + SECTIONS.length - 1) % SECTIONS.length; SFX.click(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); menuSel = (menuSel + 1) % SECTIONS.length; SFX.click(); }
    else if (e.key === 'ArrowLeft')  stepFocused(-1);
    else if (e.key === 'ArrowRight') stepFocused(1);
    return;
  }
  if (state === 'over') {
    if (e.key === 'Enter') reset();
    else if (e.key === 'Escape') goMenu();
    return;
  }
  if (state === 'paused') {
    if (e.key === 'Escape') state = 'play';
    else if (e.key === 'Enter') goMenu();
    return;
  }
  if (state === 'levelup') {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= choices.length) chooseUpgrade(n - 1);
    return;
  }
  if (e.key === 'Escape') { state = 'paused'; return; }
  if (state !== 'play') return;

  if (e.key === ' ') { e.preventDefault(); useAbility(); return; }
  if (e.key === 'Backspace') { e.preventDefault(); typed = typed.slice(0, -1); return; }
  if (e.key.length !== 1 || e.target === $('kbd')) return;
  const k = e.key.toLowerCase();
  if (!/^[a-z0-9]$/.test(k)) return;

  const candidate = typed + k;
  recordKey(enemies.some(en => en.text.startsWith(candidate)));
  const match = enemies.find(en => en.text === candidate);
  if (match) {
    destroy(match);
  } else if (enemies.some(en => en.text.startsWith(candidate))) {
    typed = candidate;
    SFX.key();
    const t = lockedTarget();
    if (t) emit(t.x + 12 + ctx.measureText(typed).width, t.y, { count: 3, speed: 60, color: GOLD, type: 'spark', size: 1.5, decay: 2.5, grav: 0 });
  } else {
    typed = '';
    if (!stats.shield) combo = 0;
    errorFlash = 200;
    SFX.wrong();
  }
});

function hexKey(s) {
  return Array.from(new TextEncoder().encode(s.toLowerCase())).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPin(name, pin) {
  const bytes = new TextEncoder().encode(`${name.toLowerCase()}:${pin}:glyphica`);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381;
  for (const b of bytes) h = ((h * 33) ^ b) >>> 0;
  return 'fb' + h.toString(16);
}

// ---------- Run statistics and end-of-game summary ----------
let run = newRun();
function newRun() { return { keys: 0, good: 0, samples: [], lastSample: 0 }; }
function recordKey(ok) {
  if (state !== 'play') return;
  run.keys++; if (ok) run.good++;
}
function runStats() {
  const mins = Math.max(playMs, 5000) / 60000; // at least 5 s so the first seconds don't spike the speed
  return {
    words: kills,
    wpm: Math.round((run.good / 5) / mins),
    acc: run.keys ? Math.round(run.good / run.keys * 100) : 100,
    secs: Math.round(playMs / 1000)
  };
}
function sampleRun() { const st = runStats(); run.samples.push({ t: playMs / 1000, wpm: st.wpm, acc: st.acc }); }
let localBest = (() => { try { return Number(localStorage.getItem('glyphica.best')) || 0; } catch (e) { return 0; } })();
let runIsBest = false;
function finalizeRun() {
  sampleRun(); shop.coins += runCoins; saveShop();
  runIsBest = score > 0 && score > localBest;
  if (runIsBest) { localBest = score; try { localStorage.setItem('glyphica.best', String(score)); } catch (e) {} }
}

function drawGraph(x, y, w, h) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();
  const S = run.samples;
  if (!S.length) { ctx.restore(); return; }
  const maxT = Math.max(1, S[S.length - 1].t), maxW = Math.max(10, ...S.map(p => p.wpm));
  const px = t => x + (t / maxT) * w;
  const pyW = v => y + h - (v / maxW) * h;
  const pyA = v => y + h - (v / 100) * h;
  const T = THEMES[settings.theme];
  const line = (fn, color, dash) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.setLineDash(dash || []);
    ctx.beginPath();
    S.forEach((p, i) => i ? ctx.lineTo(px(p.t), fn(p)) : ctx.moveTo(px(p.t), fn(p)));
    ctx.stroke(); ctx.setLineDash([]);
    S.forEach(p => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px(p.t), fn(p), 3.5, 0, Math.PI * 2); ctx.fill(); });
  };
  line(p => pyA(p.acc), 'rgba(248,250,252,0.7)', [6, 5]);
  line(p => pyW(p.wpm), T.accent);
  ctx.fillStyle = '#94a3b8'; ctx.font = '12px Prompt, "Noto Sans Thai", sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`${maxW} WPM`, x + 4, y + 12);
  ctx.textAlign = 'right';
  ctx.fillText(`${Math.round(maxT)}s`, x + w, y + h + 16);
  ctx.restore();
}

    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.strokeStyle = 'rgba(255,255,255,0.1)';

    ctx.restore();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e6edf7'; ctx.font = '700 26px Prompt, "Noto Sans Thai", sans-serif';
    ctx.fillText(String(v), bx + bw / 2, by + 30);
    ctx.fillStyle = '#94a3b8'; ctx.font = '13px Prompt, "Noto Sans Thai", sans-serif';
    ctx.fillText(label, bx + bw / 2, by + 58);
  });

  const gx = W / 2 - pw / 2 + 40, gy = top + 180, gw = pw - 80, gh = 170;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#94a3b8'; ctx.font = '13px Prompt, "Noto Sans Thai", sans-serif';
  ctx.fillText(tr('sum_graph'), gx, top + 160);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e6edf7'; ctx.font = '15px Prompt, "Noto Sans Thai", sans-serif';
  const isTh = settings.lang === 'th';
  const bestText = runIsBest ? (isTh ? 'สถิติใหม่!' : 'New best!') : (isTh ? `สูงสุดในเครื่อง ${localBest}` : `Best on this device ${localBest}`);
  ctx.fillText(`+${runCoins} ◉   ·   ${bestText}`, W / 2, top + 368);
  ctx.fillText(saveStatus || '', W / 2, top + 395);
  drawOverlayButtons([{ label: tr('retry'), act: reset }, { label: tr('menu'), act: () => { goMenu(); } }], top + 425);
}

function cuteFace(x, y, sc, smile = true) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(-5, 0, 4, 0, Math.PI * 2); ctx.arc(5, 0, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(-4.5, 0.5, 2.2, 0, Math.PI * 2); ctx.arc(5.5, 0.5, 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(-5.3, -0.6, 0.8, 0, Math.PI * 2); ctx.arc(4.7, -0.6, 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(251,113,133,0.55)';
  ctx.beginPath(); ctx.arc(-10, 5, 2.6, 0, Math.PI * 2); ctx.arc(10, 5, 2.6, 0, Math.PI * 2); ctx.fill();
  if (smile) { ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(0, 4, 3, 0.2, Math.PI - 0.2); ctx.stroke(); }
  ctx.restore();
}

function drawCreatures() {
  ctx.globalAlpha = 0.5;
  for (const c of creatures) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 40, 26, 5, 0, 0, Math.PI * 2); ctx.fill();
    let lift = Math.sin(c.t * 4) * 3;
    if (c.kind === 'dolphin') lift = -Math.abs(Math.sin(c.t * 1.6)) * 46;
    if (c.kind === 'fish') lift = Math.sin(c.x * 0.012) * 14;
    ctx.translate(c.x, c.y + lift);
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 4;

      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, -22); ctx.stroke();
      ctx.fillStyle = '#f472b6'; ctx.beginPath(); ctx.arc(0, -24, 3.5, 0, Math.PI * 2); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-4, jump - 9); ctx.lineTo(5, jump - 20); ctx.lineTo(9, jump - 7); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-26, jump); ctx.lineTo(-42, jump - 10); ctx.lineTo(-40, jump + 7); ctx.fill();
      ctx.fillStyle = '#e0f2fe'; ctx.beginPath(); ctx.ellipse(8, jump + 4, 14, 6, -0.2, 0, Math.PI * 2); ctx.fill();
      cuteFace(10, jump - 2, 0.75);
    } else if (c.kind === 'turtle') {
      ctx.fillStyle = '#86efac'; ctx.beginPath(); ctx.ellipse(0, 0, 22, 14, 0, Math.PI, 0); ctx.fill();

    } else if (c.kind === 'dragon') {

      cuteFace(0, -2, 0.7);
      for (let k = 0; k < 3; k++) { const sp = (c.t * 40 + k * 17) % 60; ctx.fillStyle = `rgba(254,240,138,${1 - sp / 60})`; ctx.beginPath(); ctx.arc(-16 - sp * 0.4, 6 - sp * 0.3, 2, 0, Math.PI * 2); ctx.fill(); }
    } else if (c.kind === 'birds') {
      for (let k = 0; k < 3; k++) {

      ctx.fillStyle = '#d6b48a'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-14, -12); ctx.lineTo(-12, -24); ctx.lineTo(-3, -14); ctx.fill();
      ctx.beginPath(); ctx.moveTo(14, -12); ctx.lineTo(12, -24); ctx.lineTo(3, -14); ctx.fill();
      ctx.fillStyle = '#fef3c7';
      ctx.beginPath(); ctx.ellipse(-6, -4, 6, 7, 0, 0, Math.PI * 2); ctx.ellipse(6, -4, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath(); ctx.arc(-6, -3, 3, 0, Math.PI * 2); ctx.arc(6, -3, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.moveTo(-2, 2); ctx.lineTo(2, 2); ctx.lineTo(0, 6); ctx.fill();

      ctx.fillStyle = '#e2e8f0'; roundRect(-18, -10, 36, 22, 8); ctx.fill();

function rrect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

      g.beginPath(); g.moveTo(-10, 6); g.lineTo(-38, -16); g.lineTo(-30, 14); g.lineTo(-22, 26); g.fill();
      g.beginPath(); g.moveTo(10, 6); g.lineTo(38, -16); g.lineTo(30, 14); g.lineTo(22, 26); g.fill();
      g.strokeStyle = c; g.lineWidth = 5; g.beginPath(); g.moveTo(14, 30); g.quadraticCurveTo(34, 40, 30, 22); g.stroke();
      g.beginPath(); g.ellipse(0, 18, 16, 18, 0, 0, 7); g.fillStyle = c; g.fill();
      circle(0, -6, 14, c);
      g.fillStyle = a; g.beginPath(); g.moveTo(-10, -16); g.lineTo(-13, -30); g.lineTo(-3, -18); g.fill();
      g.beginPath(); g.moveTo(10, -16); g.lineTo(13, -30); g.lineTo(3, -18); g.fill();
      eyes(-7);
      break;
    default:
      rrect(g, -14, 8, 28, 30, 9); g.fillStyle = c; g.fill();
      g.strokeStyle = ink; g.lineWidth = 2; g.stroke();
      circle(0, -4, 15, c);
      g.strokeStyle = ink; g.lineWidth = 2; g.beginPath(); g.arc(0, -4, 15, 0, 7); g.stroke();
      circle(-6, -12, 3.5, 'rgba(255,255,255,0.45)');
      circle(-10, 4, 3, 'rgba(251,113,133,0.55)'); circle(10, 4, 3, 'rgba(251,113,133,0.55)');
      eyes(-4);
      g.strokeStyle = ink; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 5, 0.2, Math.PI - 0.2); g.stroke();
      drawAcc(g, it.acc, c, a);
  }
  g.restore();
}

function renderShop() {

function buyOrEquip(it) {
  if (!shop.owned.includes(it.id)) {
    if (shop.coins < it.price) { $('shopCoins').textContent = tr('shop_need'); return; }
    shop.coins -= it.price;
    shop.owned.push(it.id);
  }
  shop.equipped = it.id;
  saveShop();
  SFX.select();
  renderShop();
}

// ---------- Abilities and class passives ----------
let abilityCd = 0, focusT = 0, overclockT = 0, lastKillAt = -99999;

function classOf() { return (SHOP.find(i => i.id === shop.equipped) || SHOP[0]).cls; }

function killMult() {
  let m = 1;
  if (classOf() === 'Pro') m *= 1.1;
  if (classOf() === 'Speed' && playMs - lastKillAt < 1500) m *= 1.5;
  if (overclockT > 0) m *= 2;
  lastKillAt = playMs;
  return m;
}

function useAbility() {
  if (state !== 'play' || abilityCd > 0) return;
  const it = SHOP.find(i => i.id === shop.equipped) || SHOP[0];
  const ab = it.ab;
  const lowest = n => enemies.slice().sort((a, b) => b.y - a.y).slice(0, n);
  let used = true;
  switch (ab.id) {
    case 'focus':     focusT = 5000; break;
    case 'shadow':    if (!enemies.length) used = false; lowest(1).forEach(e => destroy(e, true)); break;
    case 'arcane':    if (!enemies.length) used = false; enemies.slice().forEach(e => destroy(e, true)); break;
    case 'iron':      reprieveReady = true; break;
    case 'overclock': overclockT = 8000; break;
    case 'warp':      freezeT = 4000; break;
    case 'inferno':   if (!enemies.length) used = false; lowest(3).forEach(e => destroy(e, true)); break;
  }
  if (!used) return;
  abilityCd = ab.cd;
  SFX.levelup();
  floatText(settings.lang === 'th' ? ab.th : ab.en, 90, H - 200, GOLD, 22);
}

};

function stallRoof(C, T, x, y, w) {
  const [c1, c2] = C.roof;
  if (C.top === 'scallop') {
    const n = 6, sw = w / n;
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = i % 2 ? c2 : c1;
      ctx.fillRect(x + i * sw, y, sw, 36);
      ctx.beginPath(); ctx.arc(x + i * sw + sw / 2, y + 36, sw / 2, 0, Math.PI); ctx.fill();
    }
  } else if (C.top === 'dome') {
    ctx.fillStyle = 'rgba(56,189,248,0.25)'; ctx.strokeStyle = c1; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x + w / 2, y + 50, w / 2, 50, 0, Math.PI, 0); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e0f2fe';
    for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.arc(x + 20 + k * 27, y + 16 + (k % 3) * 9, 1.4, 0, Math.PI * 2); ctx.fill(); }
  } else if (C.top === 'stone') {
    ctx.fillStyle = '#57534e'; roundRect(x - 4, y, w + 8, 48, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1;
    for (let r = 0; r < 3; r++) { ctx.beginPath(); ctx.moveTo(x, y + 12 + r * 12); ctx.lineTo(x + w, y + 12 + r * 12); ctx.stroke(); }
    ctx.fillStyle = c1; ctx.fillRect(x - 4, y + 44, w + 8, 4);
  } else if (C.top === 'shingle') {
    ctx.fillStyle = c2; ctx.beginPath(); ctx.moveTo(x - 8, y + 48); ctx.lineTo(x + w / 2, y); ctx.lineTo(x + w + 8, y + 48); ctx.fill();
    ctx.fillStyle = c1;
    for (let r = 0; r < 3; r++) for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(x + 20 + k * 30 + (r % 2) * 14, y + 18 + r * 12, 5, 0, Math.PI * 2); ctx.fill(); }
  } else if (C.top === 'neon') {
    ctx.fillStyle = c2; roundRect(x, y, w, 46, 6); ctx.fill();
    ctx.save(); ctx.shadowColor = T.accent; ctx.shadowBlur = 16; ctx.strokeStyle = T.accent; ctx.lineWidth = 2.5;
    roundRect(x + 2, y + 2, w - 4, 42, 6); ctx.stroke(); ctx.restore();
  }
}

function stallGoods(kind, T, x, y) {
  const pal = T.palette;
  for (let k = 0; k < 3; k++) {
    const gx = x + 26 + k * 34, gy = y;
    const c = pal[k % pal.length];
    if (kind === 'orb') {
      const g = ctx.createRadialGradient(gx - 2, gy - 2, 1, gx, gy, 9);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, c);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(gx, gy, 9, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 'fish') {
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(gx, gy, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(gx - 9, gy); ctx.lineTo(gx - 16, gy - 5); ctx.lineTo(gx - 16, gy + 5); ctx.fill();
      ctx.fillStyle = '#0b1020'; ctx.beginPath(); ctx.arc(gx + 4, gy - 1, 1.4, 0, Math.PI * 2); ctx.fill();
    } else if (kind === 'flask') {
      ctx.fillStyle = c; ctx.beginPath(); ctx.arc(gx, gy + 2, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(gx - 3, gy - 12, 6, 8);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(gx - 5, gy - 2, 3, 5);
    } else if (kind === 'mushroom') {
      ctx.fillStyle = '#f5f5f4'; ctx.fillRect(gx - 3, gy, 6, 9);
      ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(gx, gy, 9, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx - 3, gy - 4, 1.6, 0, 7); ctx.arc(gx + 3, gy - 5, 1.6, 0, 7); ctx.fill();
    } else if (kind === 'chip') {
      ctx.fillStyle = '#0b1020'; ctx.fillRect(gx - 9, gy - 9, 18, 18);
      ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.strokeRect(gx - 9, gy - 9, 18, 18);
      ctx.fillStyle = c; ctx.fillRect(gx - 3, gy - 3, 6, 6);
    }
  }
}

function stallDeco(kind, C, T, x, y, w) {
  const t = time / 1000;
  if (kind === 'seaweed') {
    ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let k = 0; k < 6; k++) {
      const sx = x + 14 + k * (w - 28) / 5, len = 22 + (k % 3) * 8;
      ctx.beginPath(); ctx.moveTo(sx, y + 40);
      for (let s2 = 1; s2 <= 4; s2++) ctx.lineTo(sx + Math.sin(t * 2 + k + s2) * 4, y + 40 + s2 * len / 4);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  } else if (kind === 'flames') {
    for (let k = 0; k < 7; k++) {
      const fx = x + 12 + k * (w - 24) / 6, fl = 8 + Math.sin(t * 9 + k) * 3;
      ctx.fillStyle = k % 2 ? '#fbbf24' : '#f97316';
      ctx.beginPath(); ctx.moveTo(fx - 6, y + 2); ctx.quadraticCurveTo(fx, y - fl, fx + 6, y + 2); ctx.fill();
    }
  } else if (kind === 'lanterns') {
    for (let k = 0; k < 3; k++) {
      const lx = x + 40 + k * 70, sway = Math.sin(t * 1.6 + k) * 2;
      ctx.strokeStyle = '#a16207'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(lx, y + 46); ctx.lineTo(lx + sway, y + 60); ctx.stroke();
      ctx.fillStyle = `rgba(253,224,71,${0.55 + 0.25 * Math.sin(t * 3 + k)})`;
      ctx.shadowColor = '#fde047'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.ellipse(lx + sway, y + 66, 7, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  } else if (kind === 'lights') {
    for (let k = 0; k < 5; k++) {
      ctx.fillStyle = T.palette[(k + Math.floor(t * 2)) % T.palette.length];
      ctx.beginPath(); ctx.arc(x + 24 + k * (w - 48) / 4, y + 48, 2.5, 0, Math.PI * 2); ctx.fill();
    }
  } else if (kind === 'neon') {
    ctx.save(); ctx.shadowColor = T.accent; ctx.shadowBlur = 10; ctx.strokeStyle = T.accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 8, y + 52); ctx.lineTo(x + w - 8, y + 52); ctx.stroke(); ctx.restore();
  }
}

      g.fillStyle = ink; g.beginPath(); g.arc(5, -3, 4, 0, 7); g.fill(); break;

    case 'ghost': g.fillStyle = c; g.beginPath(); g.arc(0, 8, 17, Math.PI, 0); g.lineTo(17, 40); g.lineTo(9, 34); g.lineTo(0, 40); g.lineTo(-9, 34); g.lineTo(-17, 40); g.fill(); break;
    case 'bandana': g.fillStyle = a; g.fillRect(-16, -12, 32, 6); g.beginPath(); g.moveTo(14, -10); g.lineTo(26, -4); g.lineTo(18, 2); g.fill(); break;
    case 'wings': g.fillStyle = 'rgba(255,255,255,0.85)';

    case 'helmet': g.strokeStyle = '#94a3b8'; g.lineWidth = 3; g.beginPath(); g.arc(0, -4, 17, Math.PI, 0); g.stroke();
      g.fillStyle = a; g.beginPath(); g.ellipse(0, -22, 4, 10, 0, 0, 7); g.fill(); break;
    case 'crown': g.fillStyle = '#facc15'; g.beginPath(); g.moveTo(-12, -16); g.lineTo(-12, -28); g.lineTo(-5, -20); g.lineTo(0, -31);
      g.lineTo(5, -20); g.lineTo(12, -28); g.lineTo(12, -16); g.fill(); break;
    case 'goggles': g.strokeStyle = a; g.lineWidth = 3; g.beginPath(); g.arc(-6, -4, 5, 0, 7); g.arc(6, -4, 5, 0, 7); g.stroke(); break;
    case 'panda': g.fillStyle = ink; g.beginPath(); g.ellipse(-6, -5, 5, 4, 0, 0, 7); g.ellipse(6, -5, 5, 4, 0, 0, 7); g.fill();
      g.beginPath(); g.arc(-14, -17, 5, 0, 7); g.arc(14, -17, 5, 0, 7); g.fill(); break;
    case 'fox': g.fillStyle = c; g.beginPath(); g.moveTo(-12, -10); g.lineTo(-15, -30); g.lineTo(-2, -16); g.fill();
      g.beginPath(); g.moveTo(12, -10); g.lineTo(15, -30); g.lineTo(2, -16); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(0, 10, 8, 5, 0, 0, 7); g.fill(); break;
    case 'glasses': g.strokeStyle = ink; g.lineWidth = 2; g.beginPath(); g.arc(-6, -4, 6, 0, 7); g.arc(6, -4, 6, 0, 7); g.moveTo(0, -4); g.lineTo(0, -4); g.stroke(); break;
    case 'horn': g.fillStyle = '#fde047'; g.beginPath(); g.moveTo(-3, -16); g.lineTo(0, -35); g.lineTo(3, -16); g.fill(); break;
    case 'antennae': g.strokeStyle = a; g.lineWidth = 2; g.beginPath(); g.moveTo(-6, -14); g.lineTo(-12, -30); g.moveTo(6, -14); g.lineTo(12, -30); g.stroke();
      g.fillStyle = a; g.beginPath(); g.arc(-12, -31, 3, 0, 7); g.arc(12, -31, 3, 0, 7); g.fill(); break;
    case 'cape': g.fillStyle = a; g.beginPath(); g.moveTo(-14, 4); g.lineTo(-22, 40); g.lineTo(22, 40); g.lineTo(14, 4); g.fill(); break;
    case 'stripes': g.fillStyle = ink; for (let k = -1; k <= 1; k++) g.fillRect(-14, -8 + k * 9, 28, 3); break;
  }
  g.restore();
}
